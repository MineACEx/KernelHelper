name: Build KernelSU APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ──────────────────────────────────────────
      # 1. 拉取完整 git 历史
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ──────────────────────────────────────────
      # 2. JDK 21（AGP 9.1.0 / Kotlin 2.3.20 要求）
      # ──────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ──────────────────────────────────────────
      # 3. 安装 Android SDK
      #    • platform 36 需要 --channel=3 (canary/preview)
      #    • NDK 29.0.14206865 + cmake 3.31.5
      # ──────────────────────────────────────────
      - name: Setup Android SDK
        shell: bash
        run: |
          # 确认 sdkmanager 可用
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # 接受许可证
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true

          echo "▶ 安装 platform 36 (preview channel)..."
          $SDKMANAGER --install "platforms;android-36" --channel=3 2>&1 || {
            echo "⚠  preview channel 失败，尝试稳定通道..."
            $SDKMANAGER --install "platforms;android-36" 2>&1 || {
              echo "⚠  稳定通道也没有 36，回退到 35..."
              $SDKMANAGER --install "platforms;android-35" 2>&1
            }
          }

          echo "▶ 安装 build-tools 36.1.0..."
          $SDKMANAGER --install "build-tools;36.1.0" --channel=3 2>&1 || {
            $SDKMANAGER --install "build-tools;36.1.0" 2>&1 || {
              echo "⚠  build-tools 36.1.0 不可用，使用 latest..."
              $SDKMANAGER --install "build-tools;35.0.0" 2>&1
            }
          }

          echo "▶ 安装 NDK 29.0.14206865..."
          $SDKMANAGER --install "ndk;29.0.14206865" 2>&1 || {
            echo "⚠  NDK 29.0.14206865 不可用，尝试 27.0.12077973..."
            $SDKMANAGER --install "ndk;27.0.12077973" 2>&1
          }

          echo "▶ 安装 cmake 3.31.5..."
          $SDKMANAGER --install "cmake;3.31.5" 2>&1 || {
            $SDKMANAGER --install "cmake;3.22.1" 2>&1
          }

          echo "▶ 已安装的 SDK 组件："
          $SDKMANAGER --list_installed 2>&1 | head -30 || true

      # ──────────────────────────────────────────
      # 4. Gradle 缓存
      # ──────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ──────────────────────────────────────────
      # 5. 签名配置
      # ──────────────────────────────────────────
      - name: Configure signing
        shell: bash
        run: |
          IS_PR=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IS_PR=true
          fi

          if [ "$IS_PR" = "false" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "▶ 正式签名构建"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            cat > sign.properties << PROPEOF
          KEYSTORE_FILE=../keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          PROPEOF
          else
            echo "▶ PR / 无签名密钥 — 使用 debug 签名"
            IS_PR=true
          fi
          echo "IS_PR_BUILD=$IS_PR" >> $GITHUB_ENV

      # ──────────────────────────────────────────
      # 6. 编译
      # ──────────────────────────────────────────
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          if [ "$IS_PR_BUILD" = "true" ]; then
            ./gradlew assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew assembleRelease
          fi

      # ──────────────────────────────────────────
      # 7. 上传 APK
      # ──────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelHelper-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # ──────────────────────────────────────────
      # 8. Tag 推送时创建 Release
      # ──────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true