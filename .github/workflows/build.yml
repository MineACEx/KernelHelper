name: Build KernelSU APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ──────────────────────────────────────────
      # 1. 拉取完整 git 历史
      #    版本号 = 30000 + commit 数，版本名 = git describe
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ──────────────────────────────────────────
      # 2. JDK 21（AGP 9.1.0 / Kotlin 2.3.20 强制要求）
      # ──────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ──────────────────────────────────────────
      # 3. 安装 Android SDK 依赖项
      #    compileSdk=36    build-tools=36.1.0    ndk=29.0.14206865
      # ──────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.1.0
            ndk;29.0.14206865
            cmake;3.31.5

      # ──────────────────────────────────────────
      # 4. 接受 SDK 许可证
      # ──────────────────────────────────────────
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # ──────────────────────────────────────────
      # 5. Gradle 缓存加速
      # ──────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ──────────────────────────────────────────
      # 6. 签名配置
      #    • PR / 无 secrets → IS_PR_BUILD=true（debug 签名 + .dev 后缀）
      #    • 有 secrets  → 写入 sign.properties 进行正式签名
      # ──────────────────────────────────────────
      - name: Configure signing
        shell: bash
        run: |
          IS_PR=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IS_PR=true
          fi

          if [ "$IS_PR" = "false" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "▶ 正式签名构建"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            cat > sign.properties << PROPEOF
          KEYSTORE_FILE=../keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          PROPEOF
            echo "sign.properties 已生成"
          else
            echo "▶ PR / 无签名密钥 — 使用 debug 签名"
            IS_PR=true
          fi

          echo "IS_PR_BUILD=$IS_PR" >> $GITHUB_ENV

      # ──────────────────────────────────────────
      # 7. 编译
      # ──────────────────────────────────────────
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          if [ "$IS_PR_BUILD" = "true" ]; then
            ./gradlew assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew assembleRelease
          fi

      # ──────────────────────────────────────────
      # 8. 上传 APK artifact（7 天保留）
      # ──────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # ──────────────────────────────────────────
      # 9. 版本 Tag 推送时自动创建 GitHub Release
      # ──────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true